# Tiny Tapeout project information
project:
  title:        "Moola DP SRAM 16x8"
  author:       "Anand Nagaraj"
  discord:      ""
  description:  "16-entry 8-bit dual-port standard-cell SRAM module"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_moola_sram"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  source_files:
    - "project.v"
    - "moola_dp_sram.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (ui_in)
  ui[0]: "addr_a[0]"
  ui[1]: "addr_a[1]"
  ui[2]: "addr_a[2]"
  ui[3]: "addr_a[3]"
  ui[4]: "en_a"
  ui[5]: "we_a"
  ui[6]: "en_b"
  ui[7]: ""

  # Outputs (uo_out)
  uo[0]: "rdata_a[0]"
  uo[1]: "rdata_a[1]"
  uo[2]: "rdata_a[2]"
  uo[3]: "rdata_a[3]"
  uo[4]: "rdata_a[4]"
  uo[5]: "rdata_a[5]"
  uo[6]: "rdata_a[6]"
  uo[7]: "rdata_a[7]"

  # Bidirectional pins configured as write data inputs (uio_in)
  uio[0]: "wdata_a[0]"
  uio[1]: "wdata_a[1]"
  uio[2]: "wdata_a[2]"
  uio[3]: "wdata_a[3]"
  uio[4]: "wdata_a[4]"
  uio[5]: "wdata_a[5]"
  uio[6]: "wdata_a[6]"
  uio[7]: "wdata_a[7]"

# Do not change!
yaml_version: 6